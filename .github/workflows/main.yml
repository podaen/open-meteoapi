name: ESP32 CI

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 platform
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install JSON parser dependency
        run: |
          mkdir -p "$HOME/Arduino/libraries"
          git clone --depth 1 \
            https://github.com/podaen/json-streaming-parser.git \
            "$HOME/Arduino/libraries/JsonStreamingParser"

      - name: Install this library
        run: |
          mkdir -p "$HOME/Arduino/libraries/OpenMeteo"
          cp -R "$GITHUB_WORKSPACE"/. "$HOME/Arduino/libraries/OpenMeteo"/

      - name: Compile basic example
        run: |
          mkdir -p "$RUNNER_TEMP/basic"
          cp examples/basic/basic.ino "$RUNNER_TEMP/basic/"
          # Compile-only placeholder; real sketches must supply a trusted CA.
          echo 'static const char rootCA[] = "";' > "$RUNNER_TEMP/basic/Cert_open-meteo.h"
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            "$RUNNER_TEMP/basic"
